name: oceanflow-v2
services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: seafood
      POSTGRES_USER: seafood
      POSTGRES_PASSWORD: ${DB_PASSWORD:-SeafoodLocal2026}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata_v2:/var/lib/postgresql/data
      - ./database/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seafood -d seafood"]
      interval: 5s
      timeout: 5s
      retries: 30
  app:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/seafood
      DB_USER: seafood
      DB_PASSWORD: ${DB_PASSWORD:-SeafoodLocal2026}
      TZ: Asia/Ho_Chi_Minh
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  pgdata_v2:
